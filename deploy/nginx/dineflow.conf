# /etc/nginx/sites-available/dineflow.conf
# High-Performance Nginx Reverse Proxy Configuration for DineFlow
# Optimized for VPS: HTTP/2, Gzip compression, Upstream Keepalive, and Static Asset Caching

# Upstream pool for Next.js Web Frontend
upstream dineflow_web_upstream {
    server 127.0.0.1:3500;
    keepalive 32;
}

# Upstream pool for Go REST API Backend
upstream dineflow_api_upstream {
    server 127.0.0.1:8500;
    keepalive 32;
}

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name dine.rovixatech.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dine.rovixatech.com;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/dine.rovixatech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dine.rovixatech.com/privkey.pem;

    # SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Gzip Compression (Reduces bundle sizes by 70-80%)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Buffer & Timeout Optimizations
    client_max_body_size 25M;
    client_body_buffer_size 128k;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ── A. Next.js Static Assets (Immutable Cache) ──────────────────────────
    # Content-hashed chunks in /_next/static/ can be cached by browsers for 1 year
    location /_next/static/ {
        proxy_pass http://dineflow_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Caching headers
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── B. Public Static Files (Images, Icons, Fonts) ───────────────────────
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://dineflow_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        access_log off;
    }

    # ── C. Go REST API Backend ──────────────────────────────────────────────
    location /api/v1/ {
        proxy_pass http://dineflow_api_upstream/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── D. WebSocket Endpoint (Real-time updates, Kitchen display) ─────────
    location /ws {
        proxy_pass http://dineflow_api_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── E. Next.js Frontend (SSR & Pages) ───────────────────────────────────
    location / {
        proxy_pass http://dineflow_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
