name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dineflow
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/api/go.sum

      - name: Test Go API
        working-directory: apps/api
        run: |
          go mod download
          go test -v ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Typecheck & Build Frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://dine.rovixatech.com/api/v1
          NEXT_PUBLIC_WS_URL: wss://dine.rovixatech.com
          NEXT_PUBLIC_APP_URL: https://dine.rovixatech.com
          NEXT_PUBLIC_ORDERING_URL: https://dine.rovixatech.com/order
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    name: Deploy to VPS
    needs: [test-and-lint]
    runs-on: ubuntu-latest
    if: ${{ secrets.DINEFLOW_SSH_KEY != '' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DINEFLOW_SERVER_IP }}
          username: ${{ secrets.DINEFLOW_SERVER_USER }}
          key: ${{ secrets.DINEFLOW_SSH_KEY }}
          script: |
            set -e
            cd /opt/dineflow
            ./deploy/deploy.sh
