name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dineflow
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY: ${{ secrets.DINEFLOW_SSH_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/api/go.sum

      - name: Test Go API
        working-directory: apps/api
        run: |
          go mod download
          go test -v ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Build Frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://dine.rovixatech.com/api/v1
          NEXT_PUBLIC_WS_URL: wss://dine.rovixatech.com
          NEXT_PUBLIC_APP_URL: https://dine.rovixatech.com
          NEXT_PUBLIC_ORDERING_URL: https://dine.rovixatech.com/order
        run: |
          npm ci
          npm run build

      - name: Deploy to VPS
        if: ${{ env.DEPLOY_KEY != '' }}
        env:
          SSH_KEY: ${{ secrets.DINEFLOW_SSH_KEY }}
          SERVER_IP: ${{ secrets.DINEFLOW_SERVER_IP }}
          SERVER_USER: ${{ secrets.DINEFLOW_SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "$SERVER_USER@$SERVER_IP" "cd /opt/dineflow && git fetch origin main && git reset --hard origin/main && chmod +x deploy/*.sh && ./deploy/deploy.sh" 2>&1 | tee deploy.log
        continue-on-error: true

      - name: Publish Deploy Log to Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f deploy.log ]; then
            gh issue create --repo himanshuvns/DineFlow --title "Deploy Log: $(git rev-parse --short HEAD)" --body-file deploy.log || true
            if grep -q "✖" deploy.log 2>/dev/null || ! grep -q "✔ DineFlow deployment complete successfully!" deploy.log 2>/dev/null; then
              echo "Deploy gate reported failure in deploy.log"
              exit 1
            fi
          fi
