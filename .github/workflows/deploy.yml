name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dineflow
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY: ${{ secrets.DINEFLOW_SSH_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/api/go.sum

      - name: Test Go API
        working-directory: apps/api
        run: |
          go mod download
          go test -v ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Build Frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://dine.rovixatech.com/api/v1
          NEXT_PUBLIC_WS_URL: wss://dine.rovixatech.com
          NEXT_PUBLIC_APP_URL: https://dine.rovixatech.com
          NEXT_PUBLIC_ORDERING_URL: https://dine.rovixatech.com/order
        run: |
          npm ci
          npm run build

      - name: Deploy to VPS
        if: ${{ env.DEPLOY_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DINEFLOW_SERVER_IP }}
          username: ${{ secrets.DINEFLOW_SERVER_USER }}
          key: ${{ secrets.DINEFLOW_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/dineflow
            echo "── Updating repository on VPS..."
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy/*.sh
            echo "── Executing deploy script..."
            ./deploy/deploy.sh
